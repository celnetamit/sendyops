# Docker Compose for Sendy Dashboard

version: "3.8"

services:
  sendy-dashboard:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./prisma:/app/prisma
    restart: unless-stopped
    depends_on:
      - db
  
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sendyuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sendypassword}
      - POSTGRES_DB=${POSTGRES_DB:-sendydashboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/stats",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
